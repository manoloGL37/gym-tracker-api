spring:
  application:
    name: gymtracker-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gymtracker}
    username: ${SPRING_DATASOURCE_USERNAME:gymtracker}
    password: ${SPRING_DATASOURCE_PASSWORD:gymtracker}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://gym-tracker-eight-dun.vercel.app}
  auth:
    refresh-expiration: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

server:
  port: ${PORT:8080}
